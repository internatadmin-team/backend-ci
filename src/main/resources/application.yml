# Aucun secret ici : les valeurs sensibles viennent de l'environnement (voir .env.example).
spring:
  application:
    name: internatadmin
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Hibernate ne touche jamais au schema : Flyway en est responsable
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Jackson 3 change plusieurs valeurs par defaut : le contrat du frontend garde celles du monolithe
    use-jackson2-defaults: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Tomcat doit lire un envoi trop gros en entier pour pouvoir repondre 413 FILE_TOO_LARGE
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # surcharge du POM : springdoc suppose sinon sa propre version de swagger-ui
    version: '@swagger-ui.version@'
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Cle HS256 encodee en base64, 256 bits minimum : le demarrage echoue si elle est absente ou trop courte
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  storage:
    logo-dir: ${LOGO_DIR:uploads/logos}
  admin:
    # Utilise uniquement si aucun compte ADMIN n'existe encore (premier demarrage)
    initial-password-hash: ${ADMIN_INITIAL_PASSWORD_HASH:}
  paiement:
    lock-timeout: ${PAIEMENT_LOCK_TIMEOUT:5s}
